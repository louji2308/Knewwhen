app:
  id: "ari:cloud:ecosystem::app/379ee125-304c-41a7-bbdc-81c40a27d957"
  runtime:
    name: "nodejs24.x"
permissions:
  scopes:
    - "read:jira-work"
    - "write:jira-work"
    - "read:jira-user"
    - "storage:app"
    - "report:personal-data"
    - "read:servicedesk-request"
modules:
  jira:issuePanel:
    - key: "knewwhen-case"
      resource: "main"
      resolver:
        function: "resolver"
      render: "native"
      title: "KnewWhen"
      description: "Decision support for adverse-event reporting clocks."
  jira:adminPage:
    - key: "knewwhen-admin"
      resource: "main"
      resolver:
        function: "resolver"
      render: "native"
      title: "KnewWhen settings"
      description: "Configure projects, roles, rule sets and signal screening."
  jira:issueContext:
    - key: "knewwhen-context"
      resource: "main"
      resolver:
        function: "resolver"
      render: "native"
      title: "KnewWhen signal"
      label: "KnewWhen signal"
      description: "Collapsible signal nudge on the issue view."
  jira:entityPropertySet:
    - key: "knewwhen-projection"
      properties:
        - propertyKey: "knewwhen.case"
          entityType: "issue"
          values:
            - path: "schemaVersion"
              type: "number"
              searchAlias: "knewwhenProjectionVersion"
            - path: "state"
              type: "string"
              searchAlias: "knewwhenCaseState"
            - path: "signalFlag"
              type: "number"
              searchAlias: "knewwhenSignalFlag"
            - path: "routingState"
              type: "string"
              searchAlias: "knewwhenRoutingState"
            - path: "decisionStatus"
              type: "string"
              searchAlias: "knewwhenDecisionStatus"
            - path: "decisionVersion"
              type: "number"
              searchAlias: "knewwhenDecisionVersion"
            - path: "deadlineStatus"
              type: "string"
              searchAlias: "knewwhenDeadlineStatus"
            - path: "awarenessDate"
              type: "date"
              searchAlias: "knewwhenAwarenessDate"
            - path: "ruleSetRef"
              type: "string"
              searchAlias: "knewwhenRuleSet"
            - path: "ruleSetStatus"
              type: "string"
              searchAlias: "knewwhenRuleSetStatus"
            - path: "dueDate"
              type: "date"
              searchAlias: "knewwhenDueDate"
            - path: "daysLeft"
              type: "number"
              searchAlias: "knewwhenDaysLeft"
            - path: "daysLeftAsOf"
              type: "date"
              searchAlias: "knewwhenDaysLeftAsOf"
  function:
    - key: "resolver"
      handler: "index.resolver"
    - key: "event-trigger"
      handler: "index.trigger"
    - key: "scan-consumer"
      handler: "index.scanConsumer"
    - key: "writeback-consumer"
      handler: "index.writebackConsumer"
    - key: "daily-reconcile"
      handler: "index.scheduled"
  trigger:
    - key: "knewwhen-events"
      function: "event-trigger"
      events:
        - "avi:jira:created:issue"
        - "avi:jira:updated:issue"
        - "avi:jira:created:comment"
        - "avi:jira:updated:comment"
        - "avi:jira:deleted:comment"
        - "avi:jira:created:issue-link"
  consumer:
    - key: "scan-queue"
      queue: "knewwhen-scan"
      function: "scan-consumer"
    - key: "writeback-queue"
      queue: "knewwhen-writeback"
      function: "writeback-consumer"
  scheduledTrigger:
    - key: "knewwhen-daily"
      function: "daily-reconcile"
      interval: "24h"
  llm:
    - key: "knewwhen-llm"
      model:
        - "claude"
  sql:
    - key: "knewwhen-main"
      engine: "mysql"
resources:
  - key: "main"
    path: "src/frontend/index.jsx"
